services:
  mysql:
    image: mysql:8.4
    container_name: dibstable-mysql
    # 컨테이너 기본 타임존은 UTC라 NOW()가 KST와 9시간 어긋난다 (service-apis.md 공통 규칙)
    command: --default-time-zone=Asia/Seoul
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1로 TCP를 강제한다. localhost는 유닉스 소켓으로 붙어
      # init 스크립트를 돌리는 임시 서버(--skip-networking)에 응답하므로 거짓 healthy가 된다.
      # ping은 인증 실패에도 exit 0이라 실제 쿼리로 확인한다.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    container_name: dibstable-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 이중 리스너: 컨테이너는 kafka:19092, 호스트는 localhost:9092로 붙는다.
      # 단일 리스너(localhost)면 서비스를 컨테이너로 올리는 순간 접속이 깨진다.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 파티션 키(restaurantId)의 순서 보장을 검증하려면 파티션이 2개 이상이어야 한다 (3.3.5).
      # 단, 토픽은 애플리케이션이 NewTopic으로 명시 선언한다 — 이 값은 보조 안전망일 뿐이다.
      KAFKA_NUM_PARTITIONS: 3
      # 기본 3초. 개발 중 컨슈머가 붙을 때마다 기다릴 이유가 없다.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 이미지 기본값은 /tmp/kafka-logs(컨테이너 쓰기 레이어)라 down 한 번에 토픽·오프셋이 사라진다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 매번 JVM을 새로 띄우는 검사라 유휴 시에도 1.5초가량 걸린다.
      # 앱·Gradle이 함께 도는 중에 진동하지 않도록 간격과 유예를 넉넉히 둔다.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  mysql-data:
  kafka-data:
